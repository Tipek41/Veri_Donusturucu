<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veri Dönüştürücü</title>
    <!-- EXCELJS LIBRARY (Gerçek .xlsx çıktısı için) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    
    <style>
        :root {
            --bg-color: #111329;
            --card-bg: #1b1e37;
            --border-color: #383e60;
            --accent-1: #94c7ff;
            --accent-2: #c9adff;
            --accent-3: #ffa7cf;
            --danger: #ff6b6b;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, #334e8466, transparent 25%),
                              radial-gradient(circle at 85% 30%, #ac428540, transparent 25%);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            background: linear-gradient(45deg, var(--accent-1), var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.4;
        }

        main {
            display: grid;
            grid-template-columns: 370px 1fr;
            gap: 22px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 860px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-1);
        }

        .num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: var(--bg-color);
            border-radius: 50%;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            min-height: 44px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-2);
            background-color: rgba(201, 173, 255, 0.05);
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select {
            width: 100%;
            padding: 10px 35px 10px 10px;
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-light);
            box-sizing: border-box;
            min-height: 44px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 12px auto;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: var(--accent-1);
        }

        /* Liste elemanlarının okunabilirliğini artıran yeni kural */
        option {
            background-color: var(--card-bg);
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            min-height: 44px;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            color: var(--bg-color);
        }

        .btn-secondary {
            background: var(--border-color);
            color: var(--text-light);
        }
        
        .btn-danger {
            background: rgba(255, 107, 107, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 107, 107, 0.3);
            margin-top: 20px;
        }
        
        .btn-danger:hover {
            background: rgba(255, 107, 107, 0.2);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid rgba(56, 62, 96, 0.4);
            white-space: nowrap;
        }

        th {
            background-color: rgba(0,0,0,0.3);
            color: var(--accent-1);
            font-weight: 600;
        }

        #file-name-display {
            color: var(--accent-3);
            margin-top: 10px;
            font-size: 0.9rem;
            word-break: break-all;
            text-align: center;
        }
        
        hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Veri Dönüştürücü</h1>
        <p class="subtitle">Herhangi bir metin, CSV, TSV veya veri dosyasını anında analiz edip biçimlendirilmiş gerçek XLSX veya CSV formatlarına dönüştürün.</p>
    </header>

    <main>
        <section id="controls">
            <h2><span class="num">1</span> Veri Yükle</h2>
            
            <div class="drop-zone" id="drop-zone">
                <span id="drop-text">Dosyayı buraya sürükleyin veya tıklayın<br><small>(TXT, CSV, TSV, DAT)</small></span>
                <input type="file" id="file-input" accept=".txt,.csv,.dat,.tsv">
            </div>
            <div id="file-name-display"></div>

            <div class="form-group" style="margin-top: 15px;">
                <label>Karakter Kodlaması (Encoding)</label>
                <select id="encoding-select">
                    <option value="windows-1254">Türkçe (Windows-1254) - Önerilen</option>
                    <option value="utf-8">Evrensel (UTF-8)</option>
                    <option value="iso-8859-9">Türkçe (ISO-8859-9)</option>
                </select>
            </div>

            <div class="form-group" style="margin-top:15px;">
                <label>CSV Dışa Aktarım Ayırıcısı</label>
                <select id="csv-separator">
                    <option value=";">Noktalı Virgül (;) - Türkçe Excel</option>
                    <option value=",">Virgül (,) - Evrensel</option>
                    <option value="\t">Tab (Boşluk) - TSV</option>
                </select>
            </div>

            <hr>

            <h2><span class="num">2</span> Dışa Aktar</h2>
            <button class="btn btn-primary" id="btn-excel">XLSX İndir (.xlsx)</button>
            <button class="btn btn-secondary" id="btn-csv">CSV / TSV İndir</button>
            
            <button class="btn btn-danger" id="btn-clear">Sayfayı Temizle</button>
        </section>

        <section id="preview">
            <h2><span class="num">3</span> Önizleme</h2>
            <div class="table-container" id="table-container">
                <p style="color: var(--text-muted); text-align: center; padding: 40px;">Henüz veri yüklenmedi.</p>
            </div>
            <div id="table-info" style="text-align:center; color:var(--text-muted); font-size:0.9rem;"></div>
        </section>
    </main>

    <script>
        let globalHeaders = [];
        let globalData = [];
        let originalFileName = "tablo";
        let rawArrayBuffer = null;

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const encodingSelect = document.getElementById('encoding-select');
        const tableContainer = document.getElementById('table-container');
        const fileNameDisplay = document.getElementById('file-name-display');
        const tableInfo = document.getElementById('table-info');

        // Drag & Drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        encodingSelect.addEventListener('change', () => {
            if (rawArrayBuffer) processArrayBuffer(rawArrayBuffer);
        });
        
        // Sayfayı Temizle
        document.getElementById('btn-clear').addEventListener('click', () => {
            globalHeaders = [];
            globalData = [];
            originalFileName = "tablo";
            rawArrayBuffer = null;
            fileInput.value = "";
            fileNameDisplay.textContent = "";
            tableContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px;">Henüz veri yüklenmedi.</p>';
            tableInfo.innerHTML = "";
        });

        function handleFile(file) {
            originalFileName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            fileNameDisplay.textContent = "Yüklenen Dosya: " + file.name;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                rawArrayBuffer = e.target.result;
                processArrayBuffer(rawArrayBuffer);
            };
            reader.readAsArrayBuffer(file);
        }

        function processArrayBuffer(buffer) {
            const encoding = encodingSelect.value;
            const decoder = new TextDecoder(encoding);
            let text = decoder.decode(buffer);
            parseTextData(text);
        }

        function parseTextData(text) {
            if (!text || text.trim() === '') return;

            const firstLineIndex = text.indexOf('\n');
            const firstLine = text.substring(0, firstLineIndex > -1 ? firstLineIndex : text.length);
            
            let delimiter = '\t';
            const tabCount = (firstLine.match(/\t/g) || []).length;
            const semiCount = (firstLine.match(/;/g) || []).length;
            const commaCount = (firstLine.match(/,/g) || []).length;
            
            if (semiCount > tabCount && semiCount > commaCount) delimiter = ';';
            else if (commaCount > tabCount && commaCount > semiCount) delimiter = ',';

            // Gelişmiş Parser (Tırnak içindeki ayraçları korur)
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let insideQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        currentCell += '"';
                        i++; 
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === delimiter && !insideQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                } else if ((char === '\r' || char === '\n') && !insideQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(currentCell.trim());
                    
                    if (currentRow.length > 1 || currentRow[0] !== '') {
                        rows.push(currentRow);
                    }
                    currentRow = [];
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }
            
            if (currentCell !== '' || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                if (currentRow.length > 1 || currentRow[0] !== '') {
                    rows.push(currentRow);
                }
            }

            if (rows.length === 0) return;

            const baseHeaders = rows[0].map(h => h.trim());
            const colCount = baseHeaders.length;
            
            globalHeaders = baseHeaders;
            globalData = [];

            for (let i = 1; i < rows.length; i++) {
                let row = rows[i];
                if (row.length > colCount) {
                    row = row.slice(0, colCount);
                } else {
                    while (row.length < colCount) row.push("");
                }
                globalData.push(row);
            }

            renderTable();
        }

        // JS Date objesi döndüren fonksiyon
        function parseToDateObj(val) {
            if (!val) return null;
            val = val.trim();
            
            const matchTRTime = val.match(/^(\d{2})[\.\/\-](\d{2})[\.\/\-](\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/);
            if (matchTRTime) {
                return new Date(matchTRTime[3], parseInt(matchTRTime[2])-1, matchTRTime[1], matchTRTime[4], matchTRTime[5], matchTRTime[6]);
            }

            const matchTR = val.match(/^(\d{2})[\.\/\-](\d{2})[\.\/\-](\d{4})$/);
            if (matchTR) return new Date(matchTR[3], parseInt(matchTR[2])-1, matchTR[1]);
            
            const matchISOTime = val.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2}):(\d{2})$/);
            if (matchISOTime) {
                return new Date(matchISOTime[1], parseInt(matchISOTime[2])-1, matchISOTime[3], matchISOTime[4], matchISOTime[5], matchISOTime[6]);
            }

            const matchISO = val.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (matchISO) return new Date(matchISO[1], parseInt(matchISO[2])-1, matchISO[3]);
            
            return null;
        }

        // Float numara döndüren fonksiyon
        function parseNumeric(val) {
            if (!val) return null;
            val = val.trim();
            
            const trFormat = /^-?\d{1,3}(\.\d{3})*(,\d+)?$/;
            if (trFormat.test(val)) {
                return parseFloat(val.replace(/\./g, '').replace(',', '.'));
            }
            
            const usFormat = /^-?\d{1,3}(,\d{3})*(\.\d+)?$/;
            if (usFormat.test(val) && val.includes(',')) {
                return parseFloat(val.replace(/,/g, ''));
            }
            
            if (!isNaN(val) && val !== "") return parseFloat(val);
            
            return null;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function renderTable() {
            if (!globalHeaders.length) return;

            let html = '<table><thead><tr>';
            globalHeaders.forEach(h => html += `<th>${escapeHtml(h)}</th>`);
            html += '</tr></thead><tbody>';

            const previewData = globalData.slice(0, 50);

            previewData.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => {
                    html += `<td>${escapeHtml(cell || '')}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            tableContainer.innerHTML = html;

            if (globalData.length > 50) {
                tableInfo.innerHTML = `<span style="color:var(--accent-3);">Toplam <b>${globalData.length}</b> satır.</span> Önizleme performansı için ilk 50 satır gösteriliyor.`;
            } else if (globalData.length > 0) {
                tableInfo.innerHTML = `Toplam <b>${globalData.length}</b> satır.`;
            } else {
                tableInfo.innerHTML = "";
            }
        }

        document.getElementById('btn-excel').addEventListener('click', async () => {
            if (!globalHeaders.length) return alert("Önce veri yükleyin.");
            if (typeof ExcelJS === 'undefined') {
                return alert("ExcelJS kütüphanesi yüklenemedi. Lütfen internet bağlantınızı kontrol edin.");
            }

            const colCount = globalHeaders.length;
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('AktarilanVeri');

            // --- Başlık Satırı ---
            const headerRow = worksheet.addRow(globalHeaders);
            headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            headerRow.eachCell((cell) => {
                cell.fill = {
                    type: 'pattern',
                    pattern: 'solid',
                    fgColor: { argb: 'FF4F81BD' }
                };
                cell.border = {
                    bottom: { style: 'thin', color: { argb: 'FF000000' } }
                };
                cell.alignment = { vertical: 'middle', horizontal: 'center' };
            });

            // --- Veri Satırları ---
            globalData.forEach((row) => {
                const excelRow = worksheet.addRow(row);

                excelRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                    const originalVal = row[colNumber - 1];
                    const dateObj = parseToDateObj(originalVal);
                    const numObj = parseNumeric(originalVal);

                    // Veri Tipi ve Formatlama
                    if (dateObj !== null) {
                        cell.value = dateObj;
                        cell.numFmt = 'dd.mm.yyyy hh:mm:ss';
                    } else if (numObj !== null) {
                        cell.value = numObj;
                        cell.numFmt = '#,##0.00';
                    } else {
                        cell.value = originalVal;
                    }
                });
            });

            // --- Tablo Özellikleri (Freeze Panes & AutoFilter) ---
            worksheet.views = [
                { state: 'frozen', xSplit: 0, ySplit: 1, activeCell: 'A2' }
            ];
            
            // AutoFilter için alan belirtme
            worksheet.autoFilter = {
                from: { row: 1, column: 1 },
                to: { row: 1, column: colCount }
            };

            // --- Sütun Genişliklerini Dinamik Ayarlama (Auto-Fit) ---
            for (let i = 1; i <= colCount; i++) {
                let maxLength = 0;
                worksheet.getColumn(i).eachCell({ includeEmpty: true }, (cell) => {
                    const cellValue = cell.value ? cell.value.toString() : '';
                    if (cellValue.length > maxLength) {
                        maxLength = cellValue.length;
                    }
                });
                worksheet.getColumn(i).width = Math.min(Math.max(maxLength + 2, 12), 60);
            }

            // Dosyayı oluştur ve indir
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${originalFileName}_aktarilan.xlsx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('btn-csv').addEventListener('click', () => {
            if (!globalHeaders.length) return alert("Önce veri yükleyin.");
            
            const sep = document.getElementById('csv-separator').value;
            let csvContent = "\uFEFF"; 
            
            const escapeCSV = (val) => {
                if (val == null) return "";
                let str = String(val);
                if (str.includes(sep) || str.includes('"') || str.includes('\n')) {
                    str = '"' + str.replace(/"/g, '""') + '"';
                }
                return str;
            };

            csvContent += globalHeaders.map(escapeCSV).join(sep) + "\n";
            globalData.forEach(row => {
                csvContent += row.map(escapeCSV).join(sep) + "\n";
            });

            const ext = sep === '\t' ? 'tsv' : 'csv';
            const type = sep === '\t' ? 'text/tab-separated-values' : 'text/csv';

            const blob = new Blob([csvContent], { type: `${type};charset=utf-8;` });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${originalFileName}_aktarilan.${ext}`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
